<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>模板2 · 网站加载诊断</title><style>body{font:16px/1.65 system-ui,sans-serif;max-width:810px;margin:36px auto;padding:0 20px;color:#17312b;background:#f4f7f5}h1{font-size:27px}.card{padding:18px 22px;background:white;border:1px solid #d9e5df;border-radius:12px;margin:16px 0}li{padding:7px 0}.ok{color:#126747}.bad{color:#a53224}.pending{color:#6a716d}button,a.btn{padding:10px 18px;border:0;border-radius:8px;background:#176c54;color:white;cursor:pointer;text-decoration:none;display:inline-block;margin:6px 7px 6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf1ed;padding:14px;border-radius:8px}.small{color:#596e64;font-size:14px}</style></head><body><h1>维思工坊 · 模板 2 加载诊断</h1><p>此页面用于检查 GitHub Pages 资源加载。无需登录，不会修改网站。</p><div class="card"><div id="state">正在检查网页资源……</div><ul id="checks"></ul></div><div class="card"><button onclick="run()">重新检查</button><button onclick="copy()">复制诊断结果</button><a class="btn" href="./">返回主页</a><pre id="report"></pre><div class="small">如有失败，请将诊断结果发给维思工坊。</div></div><script>const paths=['index.html','assets/app.js','assets/style.css','content/profile.md','content/research.md','content/publications.md','content/projects.md','content/experience.md','content/contact.md'];let output='';async function run(){let report=['当前地址：'+location.href,'来源地址：'+location.origin,'检查时间：'+new Date().toISOString(),'浏览器：'+navigator.userAgent,''];document.getElementById('checks').innerHTML='';for(let path of paths){let line=document.createElement('li');line.className='pending';line.textContent='检查 '+path+' ...';document.getElementById('checks').append(line);try{let resp=await fetch(path+'?diagnostic='+Date.now(),{cache:'no-store'});let text=await resp.text();let passed=resp.ok;line.className=passed?'ok':'bad';line.textContent=(passed?'✓':'✕')+' '+path+' — HTTP '+resp.status+' ('+text.length+' 字符)';report.push(path+': HTTP '+resp.status+'; bytes '+text.length)}catch(e){line.className='bad';line.textContent='✕ '+path+' — '+e.message;report.push(path+': '+e.message)}}output=report.join('\n');document.getElementById('report').textContent=output;document.getElementById('state').textContent='检查完成：红色项目代表资源加载失败。'}async function copy(){try{await navigator.clipboard.writeText(output);alert('诊断结果已复制')}catch(e){alert('复制失败，请手动复制文本')}}run()</script></body></html>
